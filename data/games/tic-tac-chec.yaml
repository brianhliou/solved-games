board: >
  4×4 board, empty at the start. Each player owns one pawn, knight, bishop and
  rook. White moves first. For the first six plies players alternate placing a
  piece from hand on any empty square; after both have placed three, a turn is
  one placement or one move. Pieces move and capture as in chess, with no
  kings and no check; a captured piece goes back to its owner's hand. Four of
  one player's pieces in a rank, file or long diagonal wins.

  hexagon plus six 3-cell corners, 37 cells. Three players start on
  alternating corners, each with 3 marbles filling their own corner, and race
  to the opposite corner. Also solved: the 13-cell star with corner side 1
  (a 7-cell hexagon plus six 1-cell corners), 1 marble each.
result: no-forced-win
result_detail: "No forced win. From the start no player can force their own win against the other two; any two players together can force the third to lose; every player can hand the win to either opponent (all six kingmaker relations hold); and no lone player can force a draw. The start is the same on both solved boards, 37 cells with 3 marbles each and 13 cells with 1 marble each. Strongly solved: every position's answer to each of these forcing questions is known."

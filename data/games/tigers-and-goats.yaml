id: tigers-and-goats
name: Tigers and Goats
# Wikipedia's solved-games list names it "Lambs and Tigers." The related Indian game Aadu Puli Aatam
# uses a different board, so "also known as" here groups the hunt-game family loosely.
also_known_as:
  - "Bagh-Chal"
  - "Bagha Chal"
  - "Bagh-chal"
  - "Moving Tiger"
  - "Lambs and Tigers"
  - "Aadu Puli Aatam"
  - "Aadu Puli"
family: other
genre: hunt
board: "5x5 grid of 25 points connected by horizontal, vertical and diagonal lines (Bagh-Chal board). Asymmetric: 4 tigers (start on the 4 corner points) face up to 20 goats. Goat moves first."
result: draw
result_detail: "Draw under optimal play from the standard start (4 tigers on the corners, Goat to play first). Both 'Goat can at least draw' and 'Tiger can at least draw' were proved, so the game-theoretic value of the initial position is a draw."
strength: weak
# method=alpha-beta+db denotes the database-backed forward (alpha-beta-style) placement search
# combined with the retrograde endgame and halfway databases.
method:
  - retrograde-analysis
  - alpha-beta+db
distance_to_result: ""
# game_tree = ~10^41 is the placement-phase game-tree-complexity estimate (5-goat winning criterion,
# post-symmetry, 100,000 Monte-Carlo path samples; the paper's Table 3 gives 1.28e24 / 4.23e36 /
# 8.92e38 / 3.09e40 / 4.88e41 for the 1-,2-,3-,4-,5-goat criteria respectively). state_space is left
# null because the paper reports component sizes rather than a single whole-game state-space count.
# Halfway database: Table 4 of the paper. Value distribution around the five-goat criterion: Table 2.
complexity:
  state_space: null                       # endgame sliding-phase DB = 88,260,972 symmetry-inequivalent positions (S1-S5); placement phase S0 ~ 33 billion positions / ~3.3 billion board images (not a full state-space figure for the whole game)
  game_tree: 100000000000000000000000000000000000000000   # ~10^41, placement-phase game-tree complexity (after symmetry removal), Monte-Carlo (Knuth) estimate for the 5-goat winning criterion
# Headline year 2007 is the completing paper (Games of No Chance 3); some catalogs date the volume to
# 2009.
year: 2007
solved_by: "Lim Yew Jin and Jürg Nievergelt (National University of Singapore; ETH Zurich)"
verified: true
# Independent primary line: ONE research effort (Lim Yew Jin & Nievergelt). The 2004 ICGA Journal
# paper and the 2007 Games of No Chance 3 chapter count as one independent primary source, not two.
# Wikipedia is a secondary corroborator.
sources:
  - title: "Lim Yew Jin & Jürg Nievergelt — Tigers and Goats is a Draw (Games of No Chance 3, MSRI Publications Vol. 56, 2007/2009, pp. 163-176) [primary solution paper]"
    url: "https://library.slmath.org/books/Book56/files/22jin.pdf"
  - title: "Tigers and Goats is a draw — Cambridge University Press (Games of No Chance 3, chapter page)"
    url: "https://www.cambridge.org/core/books/abs/games-of-no-chance-3/tigers-and-goats-is-a-draw/7D77BD950DEBA74032F6B3EF69A60E63"
  - title: "Lim Yew Jin & J. Nievergelt — Computing Tigers and Goats (ICGA Journal, Vol. 27, No. 3, September 2004, pp. 131-141) [earlier paper by same authors: endgame database + partial placement-phase analysis]"
    url: "https://www.semanticscholar.org/paper/Tigers-and-Goats-is-a-draw-Jin-Nievergelt/a56c599d9db48dbb66ea5e680ec6bea7e574880b"
  - title: "Bagh-chal — Wikipedia (lists the game as solved: a draw under optimal play)"
    url: "https://en.wikipedia.org/wiki/Bagh-chal"
notes: |
  Tigers and Goats (Bagh-Chal, "Moving Tiger") is an ancient Nepali asymmetric
  hunt game, in the same family as Aadu Puli Aatam and Lambs and Tigers. It is
  played on a 5x5 grid of 25 points joined by horizontal, vertical and diagonal
  lines. Four tigers start on the corners, and Goat moves first.

  The game has two phases. The placement phase lasts exactly 39 plies: Goat
  drops his 20 goats one per move while Tiger slides or jumps, a tiger jumping
  over an adjacent goat in a straight line to the empty point beyond and killing
  it. The sliding phase that follows can last forever, with Goat sliding an
  existing goat each turn. Tiger wins by capturing 5 goats and loses if no tiger
  can move; otherwise the game is drawn by repetition. Five captured goats is
  the standard criterion, and the paper shows the value distribution is well
  balanced around that number.

  Lim Yew Jin and Jürg Nievergelt proved the game a draw in two parts. They
  solved the sliding phase exhaustively by retrograde analysis: every position
  in the sliding subspaces S1-S5 (4 tigers, 16-20 goats) has a value, a database
  of 88,260,972 symmetry-inequivalent positions. The 39-ply placement phase
  (subspace S0, ~33 billion positions or ~3.3 billion board images, with a
  game-tree complexity of ~10^41 for the 5-goat criterion by a Knuth Monte-Carlo
  sample) was attacked by forward search.

  The key technique halved the effective search depth. A strong heuristic player
  faced an exhaustive opponent, and a "halfway database" of positions at ply 19
  (10 goats placed, Tiger to move) was built on the fly, so any root search ends
  within ~20 plies in the halfway database, which in turn resolves into the
  endgame database within ~20 more plies. With it the authors first proved that
  "Goat can at least draw" (Computing Tigers and Goats, 2004), then, in the 2007
  paper, that "Tiger can at least draw," which together give a draw. Two
  re-searches in separately coded C programs took ~2 months and confirmed both
  parts: "Goat can at least draw" in ~7 hours and 7.7e9 nodes, and "Tiger can at
  least draw" in ~48 hours and 4.05e10 nodes.

  The solution is weak. The sliding phase is a full tablebase, but the placement
  phase is solved only for play from the standard start: one drawing strategy
  for each side, with no value for every reachable placement position. The
  halfway database deliberately stores only enough win-or-draw positions to trap
  forward searches, and leaves out most of the S11-S15 space (~1.6 billion
  positions).

  The 2004 ICGA Journal paper, which has the endgame database and shows "Goats
  may catch up," and the 2007 Games of No Chance 3 chapter, which completes the
  proof, are the same authors' progressive write-ups of one project. No separate
  group has re-solved the game; the authors' own two re-searches are its
  verification.

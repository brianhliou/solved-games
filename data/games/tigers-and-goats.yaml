id: tigers-and-goats
name: Tigers and Goats
# Wikipedia's solved-games list names it "Lambs and Tigers." The related Indian game Aadu Puli Aatam
# uses a different board, so "also known as" here groups the hunt-game family loosely.
also_known_as:
  - "Bagh-Chal"
  - "Bagha Chal"
  - "Bagh-chal"
  - "Moving Tiger"
  - "Lambs and Tigers"
  - "Aadu Puli Aatam"
  - "Aadu Puli"
family: other
genre: hunt
board: "5x5 grid of 25 points connected by horizontal, vertical and diagonal lines (Bagh-Chal board). Asymmetric: 4 tigers (start on the 4 corner points) face up to 20 goats. Goat moves first."
result: draw
result_detail: "Draw under optimal play from the standard start (4 tigers on the corners, Goat to play first). Both 'Goat can at least draw' and 'Tiger can at least draw' were proved, so the game-theoretic value of the initial position is a draw."
strength: weak
# method=alpha-beta+db denotes the database-backed forward (alpha-beta-style) placement search
# combined with the retrograde endgame and halfway databases.
method:
  - retrograde-analysis
  - alpha-beta+db
distance_to_result: ""
# game_tree = ~10^41 is the placement-phase game-tree-complexity estimate (5-goat winning criterion,
# post-symmetry, 100,000 Monte-Carlo path samples; the paper's Table 3 gives 1.28e24 / 4.23e36 /
# 8.92e38 / 3.09e40 / 4.88e41 for the 1-,2-,3-,4-,5-goat criteria respectively). state_space is left
# null because the paper reports component sizes rather than a single whole-game state-space count.
# Halfway database: Table 4 of the paper. Value distribution around the five-goat criterion: Table 2.
complexity:
  state_space: null                       # endgame sliding-phase DB = 88,260,972 symmetry-inequivalent positions (S1-S5); placement phase S0 ~ 33 billion positions / ~3.3 billion board images (not a full state-space figure for the whole game)
  game_tree: 100000000000000000000000000000000000000000   # ~10^41, placement-phase game-tree complexity (after symmetry removal), Monte-Carlo (Knuth) estimate for the 5-goat winning criterion
year: 2007   # complete solution documented in Lim's thesis; Games of No Chance 3 chapter published in 2009.
solved_by: "Lim Yew Jin and Jürg Nievergelt (National University of Singapore; ETH Zurich)"
verified: true

    url: "https://doi.org/10.5281/zenodo.20425801"
  - title: "Robert Shi, \"Parallel Solving of Two-Player Tierable Abstract Strategy Games,\" UC Berkeley EECS Tech Report EECS-2024-87 (documents Cameron Cheung / GamesCrafters strong solve of Quarto, 2023)"
    url: "https://www2.eecs.berkeley.edu/Pubs/TechRpts/2024/EECS-2024-87.pdf"
  - title: "Luc Goossens, \"Quarto (strategy),\" Vrije Universiteit Brussel, 2000 (original 1998 solve writeup; original site removed, Wayback archive)"
    url: "https://web.archive.org/web/20041012023358/http://ssel.vub.ac.be/Members/LucGoossens/quarto/quartotext.htm"
  - title: "M. Kerner & D. Angluin, \"An exploration of Gameplay in Quarto,\" 2001 (independent symmetry/configuration analysis; cites Goossens for the draw result)"
    url: "https://www.slideshare.net/MatthewKerner2/quarto-55043713"

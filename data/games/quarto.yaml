notes: |
  Quarto! (designed by Blaise Müller, ~1985) is, in Goossens' framing, a
  generalised 4×4 variation of tic-tac-toe with one twist: you do not choose
  your own piece. Your opponent hands you the piece you must place, and then you
  hand them theirs. This record covers the standard ruleset, where a winning
  "quarto" is four in a line (row, column or one of the two diagonals) sharing
  any one of the four binary attributes. The popular advanced variant, which
  also counts four matching pieces in any 2×2 square, is a different game; its
  value is not established in these sources.

  In summer 1998 Luc Goossens solved the game weakly by alpha-beta search with
  partial symmetry reduction, establishing the draw from the start. His
  original web writeup was later removed. Cameron Cheung independently solved
  the game strongly in 2023. Goossens reported a further re-solve in 2026.

  Goossens' 2026 paper reports three independent C solvers: one hand-coded,
  and two generated by Anthropic's Claude and Google's Gemini 3.1 Pro. It
  reports identical results from all three.

  The 2026 paper reports using the game's full symmetry group. Each board has
  up to 32·16·24 = 12,288 equivalents (32 board transforms, 16 attribute inversions,
  24 attribute permutations). The (16!)² ≈ 4.38×10^26 upper estimate counts
  complete-length histories, ignoring early wins and symmetry reduction.
  All 148 unique 2+1 configurations are draws. All 3382
  unique 3+1 configurations are draws or trivial wins, so there are no
  non-trivial wins before level 4+1. Goossens reports that of 91,746 unique
  4+1 configurations, 2,959 are non-trivial wins (~3%).

  These symmetry counts match Kerner and Angluin (2001) for 2+1 and 3+1. Their
  4+1 count of 91,558 differs from Goossens' reported 91,746 by 188.
  Goossens attributes this difference to configurations that already form a
  quarto with the four pieces placed.

  In 2023 Cameron Cheung of GamesCrafters (UC Berkeley) solved Quarto strongly,
  using tier-based retrograde analysis under Dan Garcia's GAMESMAN architecture.
  Levels 0–12 are stored in a partial database; levels 13–16 are live-solved
  when queried. Together these provide a value for every reachable position.

  Shi's 2024 report gives 3.51 days on a single 12-core CPU for solving and
  position-counting, including levels that are not stored. Cheung counts
  11,029,662,094,763,537 reachable positions, including the selected piece.
  This total restores symmetry multiplicities; the solver itself uses symmetry
  reduction. It is rounded to ~1.1×10^16 in the state-space field.

id: quarto
name: Quarto!
also_known_as:
  - "Quarto"
family: other
genre: alignment
board: 4×4 board, 16 distinct pieces (each a unique combination of 4 binary attributes; standard line-win ruleset — rows, columns, two diagonals)
result: draw
result_detail: "Both players can force a draw with perfect play; like tic-tac-toe, perfect play always draws. The deepest forced win against imperfect play occurs at level 4+1 (5th piece placed, 6th piece gifted)."
# Headline fields use the STRONG solve for strength (full tablebase exists, GamesCrafters 2023) and
# report the agreed value of DRAW.
strength: strong
method:
  - alpha-beta+db
  - retrograde-analysis
  - brute-force-enumeration
  - strategy-stealing/pairing-strategy
distance_to_result: "Game value (draw) holds from the start (0+1). Deepest non-trivial forced win is at level 4+1; no non-trivial win exists above level 4+1 (i.e. from level 2+1 onward it does not matter what you play, and from 3+1 it suffices to look for a draw)."
# NOTE on state_space: the GamesCrafters figure is a POSITION count in their representation (board
# occupancy plus the piece-currently-gifted state), and it is NOT symmetry-reduced, which is why it
# dwarfs the ~10^3–10^5 unique-configuration counts Goossens reports per level. The game_tree figure
# (16!)² ≈ 4.38×10^26 is Goossens' naive full game-tree size before any pruning or symmetry reduction.
complexity:
  state_space: 11000000000000000   # GamesCrafters strong solve: "over 11 quadrillion positions" (~1.1×10^16) in their non-symmetry-reduced position representation; see notes
  game_tree: 438000000000000000000000000   # (16!)² ≈ 4.38×10^26 nodes per Goossens 2026 (naive full game-tree size)
# The 2023 strong solve is the canonical "solved" year; 1998 is the original weak determination of
# the value, and 2026 is its first independent corroboration.
year: 2023
solved_by: "Luc Goossens (weak solve, 1998; independently corroborated 2026) and Cameron Cheung / GamesCrafters, UC Berkeley (strong solve / full tablebase, 2023)"
verified: true

id: quarto
name: Quarto!
also_known_as:
  - "Quarto"
family: other
genre: alignment
board: 4×4 board, 16 distinct pieces (each a unique combination of 4 binary attributes; standard line-win ruleset — rows, columns, two diagonals)
result: draw
result_detail: "Both players can force a draw with perfect play. Non-trivial forced wins first occur at level 4+1: four pieces placed and the fifth selected; the following move places the fifth and gifts the sixth if play continues."
# Headline fields use the GamesCrafters 2023 strong solve: levels 0–12 stored,
# levels 13–16 live-solved. All reported solves agree on a draw.
strength: strong
method:
  - alpha-beta+db
  - retrograde-analysis
  - brute-force-enumeration
  - strategy-stealing/pairing-strategy
distance_to_result: "The start position (0+1) is a draw. All 2+1 positions are draws; 3+1 positions are draws or immediate wins. Non-trivial forced wins first occur at 4+1 (four pieces placed and one selected)."
# NOTE on state_space: the GamesCrafters figure is a POSITION count in their representation (board
# occupancy plus the piece-currently-gifted state), and it is NOT symmetry-reduced, which is why it
# dwarfs the ~10^3–10^5 unique-configuration counts Goossens reports per level. The game_tree figure
# (16!)² ≈ 4.38×10^26 is an upper estimate of complete-length histories/leaves,
# ignoring early wins and symmetry reduction.
complexity:
  state_space: 11000000000000000   # GamesCrafters strong solve: "over 11 quadrillion positions" (~1.1×10^16) in their non-symmetry-reduced position representation; see notes
  game_tree: 438000000000000000000000000   # (16!)² complete-length histories/leaves; upper estimate (Goossens' original writeup)
# The 2023 strong solve is the canonical "solved" year; 1998 is the original weak determination of
# the value; 2023 independently corroborates it, followed by a reported 2026 re-solve.
year: 2023
solved_by: "Luc Goossens (weak solve, 1998; reported re-solve, 2026) and Cameron Cheung / GamesCrafters, UC Berkeley (independent strong solve using a partial database plus live solving, 2023)"
# Result, year and citation are checked against the 2023 report; the design date
# and the 2026 re-solve's details are unchecked and the notes say so.
verified: true

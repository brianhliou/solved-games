id: othello
name: Othello
also_known_as:
  - "Reversi"
family: abstract
genre: capture
board: 8x8 (64 squares; standard cross start with 4 discs placed)
result: draw
result_detail: "Perfect play by both players leads to a draw (32-32)."
strength: weak
method:
  - alpha-beta+db
  - brute-force-enumeration
distance_to_result: "At most 60 disc placements from the four-disc start; passes add turns. The weak-solution proof resolved 1,505,367,525 selected proof subproblems with 36 empty squares, linked to the start through 2,587 critical proof positions with 50 empty squares."
# Approximate upper bound on total states and heuristic game-tree estimate, respectively;

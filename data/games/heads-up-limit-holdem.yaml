id: heads-up-limit-holdem
name: Heads-up Limit Texas Hold'em (HULHE)
also_known_as:
  - "HULHE"
  - "Heads-up limit hold'em"
  - "Cepheus"
family: imperfect-info
genre: imperfect-info
board: Two-player limit Texas hold'em; 52-card deck, four betting rounds (preflop/flop/turn/river), fixed bet sizes, capped raises per round, alternating dealer/button
result: first-player-win
result_detail: >
  Essentially weakly solved (NOT exactly solved): an epsilon-Nash equilibrium with
  exploitability 0.986 mbb/g (milli-big-blinds per game), below the 1 mbb/g threshold
  at which a human lifetime of play cannot statistically distinguish it from an exact
  solution at 95% confidence. The game is a win for the first player (the dealer/button):
  the strategy bounds the game-theoretic value at between 87.7 and 89.7 mbb/g in the
  dealer's favor, formally proving the dealer holds a substantial advantage. "first-player-win"
  here reflects the sign of the (real-valued, in-expectation) game value, not a discrete win.
# The schema enum offers only ultra-weak | weak | strong; strength: weak is recorded because a
# near-optimal strategy for the initial position was computed for both players, but it is
# approximate, not exact, and not a full tablebase.
strength: weak
approximate: true            # ε-Nash / "essentially weakly solved", not an exact solution
epsilon: "0.986 mbb/g (exploitability; below the ~1 mbb/g 'essentially solved' threshold)"
# Recorded under method monte-carlo-cfr (the CFR / CFR+ family). CFR+ as used here does exhaustive
# iterations rather than Monte-Carlo sampling; the "monte-carlo-cfr" tag is the schema's bucket for
# the CFR family.
method:
  - monte-carlo-cfr
distance_to_result: >
  Computed strategy reached exploitability 0.986 mbb/g after 1579 CFR+ iterations
  (900 core-years). Game value bounded to dealer +87.7 to +89.7 mbb/g.
# state_space holds the rounded 3.16e17 (distinct reachable game states, per the Science paper).
# game_tree left null: no single citable game-tree-size figure distinct from these is given.
complexity:
  state_space: 316000000000000000
  game_tree: null
year: 2015
solved_by: "Michael Bowling, Neil Burch, Michael Johanson, Oskari Tammelin (University of Alberta Computer Poker Research Group; Cepheus project)"
verified: true
sources:
  - title: "Heads-up Limit Hold'em Poker Is Solved — M. Bowling, N. Burch, M. Johanson, O. Tammelin, Science 347(6218):145-149 (2015)"
    url: "https://www.science.org/doi/10.1126/science.1259433"
  - title: "Heads-up Limit Hold'em Poker Is Solved (full text PDF, Science 2015)"
    url: "https://johanson.ca/publications/poker/2015-science-hulhe/2015-science-hulhe.pdf"
  - title: "Solving Heads-up Limit Texas Hold'em — O. Tammelin, N. Burch, M. Johanson, M. Bowling, IJCAI 2015 (CFR+ engineering, soundness proof, confirms 4800 CPUs / 68 days / 0.986 mbb/g)"
    url: "https://poker.cs.ualberta.ca/publications/2015-ijcai-cfrplus.pdf"
  - title: "ADS bibliographic record (2015Sci...347..145B)"

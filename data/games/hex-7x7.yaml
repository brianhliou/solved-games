board: 7×7 rhombus of hexagonal cells (49 cells); each player owns two opposite sides, first player connects their pair; no-swap (no pie rule) ruleset
result: first-player-win
result_detail: "First player wins with perfect play. All 49 opening moves are resolved: central openings (and the obtuse-corner short diagonal) win for the first player, and a band of 14 losing openings clusters near the two acute corners (Yang et al. derived them by symmetry), so the first player wins by opening on a central cell (e.g. the centre cell d4)."
# WEAK solution, not strong; the most common error here is to call the explicit Yang strategy
# "strong."
strength: weak
method:
  - strategy-stealing/pairing-strategy
  - knowledge-based
  - depth-first-pns
  - threat-space-search
distance_to_result: "Longest line of play is given for each of the 49 openings; the hardest single opening took ~110 hours of search, ~615 hours total for all 49 (single-processor AMD Athlon, 2003). No single uniform ply count — proof depth varies by opening."
# No 7×7-specific state-space/game-tree figure is cited in the primary paper, so both fields are left
# null rather than guessing.
complexity:
  state_space: null   # no citable 7×7-specific figure; surveys give 11×11 Hex state-space ~10^57, game-tree ~10^98. See notes.
  game_tree: null

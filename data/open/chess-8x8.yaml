barrier_detail: >
  Ronald de Man's tb8gen documentation estimates 1,500–2,000 TB for a complete
  compressed 8-piece WDL/DTZ set, with individual tables taking "many weeks, if
  not months" to generate, and 64–128 GB of RAM per pawnless table with that
  generator. These are estimates for this implementation.
cite: "Bourzutschky & Fiekas 2026"
evidence: self-archived
unverified: >
  The June 2026 KQQQvKQQQ announcement reports agreement with Bourzutschky's
  counts, but says the new WDL/DTZ verification code had not yet been run on
  that table. No later verification report was located. The Lichess blog
  post announcing op1 could not be retrieved directly (403); its coverage
  claims here rest on the op1 repository's README.

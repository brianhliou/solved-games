notes: >
  Players draw edges between adjacent dots. Completing a box captures it and
  requires another move; the higher box count wins. Sizes here count boxes,
  so a 5×5 game uses a 6×6 array of dots.

  Barker and Korf combined alpha-beta search with chain analysis, symmetry
  reductions and transposition tables. Fraser's later announcement describes
  an endgame database feeding an opening book with fewer than 400,000
  positions. It reports eight symmetric winning moves representing one
  opening. Extending the proof to a larger empty board requires controlling
  the early search as well as the endgame database.

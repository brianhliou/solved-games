notes: >
  One player places vertical dominoes and the other horizontal dominoes,
  without overlap. The player unable to place a domino loses.

  MUDoS combines alpha-beta search and transposition tables with rules that
  bound each player's remaining safe moves. Uiterwijk's 11×11 result gives
  a winning strategy from the empty board. The paper's term perfectly
  solving refers to deductions from board properties; it does not establish
  a tablebase covering every reachable position.

  This target concerns square boards. Rectangular boards have separate
  classifications, including families extending beyond the solved squares;
  their outcomes cannot be summarized by a single maximum board area.

barrier_detail: >
  Reachable positions from the start are estimated at 3.0×10^14 to 6.2×10^14
  (point estimate about 5×10^14). A dense-rank solver must index every
  arrangement, about 3.9×10^15 slots after the left-right fold, so the working
  value table is about 1 PB, with about 660 to 1,200 core-years of compute and
  $40,000 to $70,000 on bare metal. Memory was already the wall on the K+P+G
  rung: the stored-predecessor solver needed about 60.5 GiB on a 64 GB
  machine, and a dense-rank rerun that generates predecessors on demand cut
  that to about 6.86 GiB.

notes: >
  Rules as solved (the repo's rules spec, from English Wikipedia's Micro
  shogi and Japanese Wikipedia's 五分摩訶将棋, which agree on every
  substantive rule). A 4-file by 5-rank board. Each player has King, Gold,
  Silver, Bishop and Pawn: the home rank reads S G B K with the King in the
  right corner and the Pawn in front of the King. Pieces move as their shogi
  namesakes. There is no promotion zone: a non-king piece flips to its reverse
  whenever it captures, and flips back on its next capture (Gold and Rook,
  Silver and Lance, Bishop and Tokin, Pawn and Knight); the King never flips.
  A captured piece goes to the captor's hand and may be dropped on any empty
  square with either face up; there is no two-pawn rule, no ban on a pawn
  drop giving mate, and no last-rank restriction, so a dropped piece may have
  no legal move. The sources give checkmate as the win; the solver uses king
  capture, which gives the same win and loss values. Neither source states a
  repetition rule, so positions unresolved after the win/loss fixpoint are
  draws, with no perpetual-check rule; whether to model orthodox shogi's
  perpetual-check loss is left open.
  The solved rungs are reduced games with fewer pieces on the same board and
  rules, not endgames of the real game, since drops recycle material; they
  give no value for Micro Shogi from the start. This is the maintainer's own
  work, available only from the micro-shogi repository and the post, so it
  carries the self-archived mark.

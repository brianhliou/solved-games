notes: >
  Pieces move by the number of pieces of either colour on their line of
  travel. Each player tries to connect all surviving pieces; diagonal
  contact counts. The proof's rules draw simultaneous connection and a
  third repetition, and require a pass when no move is available.

  Winands used two-level proof-number search, PN². Games often end with
  many pieces still present, limiting the usefulness of small endgame
  databases. Larger-board proofs must address search growth and the
  memory needed to retain useful search information.

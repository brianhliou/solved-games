barrier_detail: >
  Winands reports 220,375,986,787 searched nodes for the 6×6 opening b6-b4.
  His estimates for 8×8 are a state space of order 10^23 and a game tree
  of order 10^64. Proof-number search also faces memory limits because it
  retains its search tree.

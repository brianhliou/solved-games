id: hex-10x10
name: Hex (10×10, remaining openings)
genre: connection
status: partially-solved
related_game: hex-9x9
solved_up_to: "9×9 all openings (weak); 10×10 one opening, f5"
next_target: "The current table of solved 10×10 opening cells from Hayward's group"
barrier:
  - compute
barrier_detail: >
  Forward depth-first proof-number search. The one published 10×10 opening (f5)
  took 63 days; the hardest 9×9 opening took 111 days on a 24-core machine
  (Pawlewicz and Hayward 2013). Each further cell is on the order of 100+
  core-days.
cite: "Pawlewicz & Hayward 2013"
evidence: refereed
unverified: >
  Which 10×10 cells beyond f5 are solved. A Hayward talk (slides undated,
  probably BIRS 2022) lists more cells with the goal of all 50, but its PDF could
  not be read as text on 2026-10-17, so no cell beyond f5 is claimed here.
sources:

id: connect6
name: Connect6 (19×19)
genre: alignment
status: partially-solved
solved_up_to: "some named openings proven wins, including Mickey Mouse (2010–2013)"
next_target: "the value of the game from Black's first stone at the centre, covering every White reply"
barrier:
  - branching
  - compute
  - algorithmic
barrier_detail: >
  Placing two stones per turn creates many candidate pairs. Relevance-zone
  proofs reduce the replies that need searching, but the published proofs
  cover selected openings. Wu and Lin's 2010 account still left tens of
  common openings unresolved.
cite: "Wu & Lin 2010"
evidence: refereed
unverified: >
  Paywalled full texts (IEEE, Springer) could not be retrieved, so the exact
  number of positions and openings each paper proves is not stated here,
  and neither is the winner of each opening beyond Mickey Mouse. The 2013
  journal paper was checked through its institutional abstract only. No
  source names the next target; it is this catalog's framing of what
  solving the game requires.

notes: >
  Connect6 is a six-in-a-row game: Black places one stone to start, then
  each player places two stones per turn. Relevance-zone search identifies
  where a defender must interfere with a threat; proof-number search
  combines the resulting cases, with jobs distributed to workers. The
  opening lists overlap, so their counts cannot be added. Determining the
  value from the centre-stone start requires handling the remaining White
  replies.

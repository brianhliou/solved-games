notes: >
  Backgammon is a dice-driven race in which each player moves fifteen checkers
  around a board of twenty-four points and then removes them. The doubling
  cube lets players raise the stakes. Once both players' remaining checkers
  are in their home boards, play reduces to a bearoff race without further
  contact. Working backward from finished positions, a database can evaluate
  legal moves against the possible dice rolls and store the resulting
  equities, or expected payoffs. Two-sided tables account for both players'
  positions and support checker and cube decisions. These endgames provide
  published partial solutions within the standard game. Longer races require
  broader tables, while positions with contact also allow hitting and return
  checkers to earlier parts of the board. Hypergammon keeps the board and
  uses three checkers per side; its complete equity database provides a
  smaller-game milestone.

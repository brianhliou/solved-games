id: backgammon
name: Backgammon
genre: chance
status: partially-solved
solved_up_to: "every bearoff with up to 15 checkers a side in the home board; Hypergammon (3 checkers a side) completely"
next_target: "every race with up to 15 checkers a side anywhere on the first 12 points, in all four cube states (Sconyers, 2014)"
barrier:
  - compute
  - storage
barrier_detail: >
  Sconyers' published home-board database already occupies 47 GB for
  approximately 3 billion positions, with equities for four cube cases.
  He describes the extended databases reported in 2014 as having huge storage
  requirements. Extending coverage requires calculating and storing values
  for combinations of both players' positions.
cite: "Sconyers 2014"
evidence: self-archived
unverified: >
  Sconyers' extended race tables and four- and five-checker solutions are
  documented here by his statement reproduced with permission in 2014;
  their data, implementation and numerical error bounds were not inspected.
  No strength label is assigned to those reports. The 1995 history dates
  establish documented availability, not original completion dates.
  The 2003 date follows Fang, Glenn and Kruskal's bibliographic citation;
  the original dated announcement was not recovered.

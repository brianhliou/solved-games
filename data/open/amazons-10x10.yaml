notes: >
  Each player controls four queen-moving amazons. A turn moves one amazon
  and fires an arrow from its destination, permanently blocking a square.
  A player unable to move loses. Arrows gradually divide the board into
  regions that can be studied separately.

  Song and Müller combined depth-first proof-number search with local
  endgame databases and bounds from combinatorial game theory. Their
  5×6 proof includes a complete winning strategy checked by a proof-tree
  checker. These results concern specified starting positions. Moving to
  the standard board requires reaching manageable local regions through
  a much wider opening search. Rectangular dimensions mean width by height.

name: Xiangqi (Chinese chess)
genre: chess
status: partially-solved
solved_up_to: "selected endgames: 8,705 material combinations, up to 13 pieces, in a public database"
next_target: "every ending up to a fixed piece count, as chess has through 7 pieces"
barrier:
  - compute
  - memory
barrier_detail: >
  Material classes require the subgames reached by captures. Wu and Beal's
  2002 results include a selected 10-piece class with 1,004,157,000 indexed
  entries. Their retrograde algorithm reduces memory use, but larger classes
  still require more positions to be indexed and evaluated. Repetition is
  decided by rules on chasing and checking rather than a simple draw, which
  the cloud database's documentation handles as Asian rules.
cite: "Chinese Chess Cloud Database"
evidence: self-archived
unverified: >
  The database's inventory pages are undated and name no author; the 8,705
  count is a row count of those pages on 2026-10-25. Completion dates and
  independent correctness of the tables are not established, nor whether any
  piece count is covered completely. No source names the next target; it is
  this catalog's framing, by analogy with chess.

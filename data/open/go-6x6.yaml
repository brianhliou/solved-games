id: go-6x6
name: Go (6×6)
genre: go
status: solved-smaller-board
related_game: go-5x5
solved_up_to: "5×5 (weak): first player wins the whole board under Japanese rules (2002) and under positional superko (2024); rectangular boards up to 5×6"
next_target: "6×6 under positional superko"
barrier:
  - compute
  - algorithmic
barrier_detail: >
  Square boards above 5×5 are unsolved. Superko cycles make the search history
  dependent (the graph-history interaction problem), and the state space grows
  far past the 5×5 solve.
cite: "Randall et al. 2024"
evidence: refereed
sources:

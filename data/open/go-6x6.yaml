    url: "https://www.ijcai.org/proceedings/2024/774"
    date: "2024"
    primary: true
  - title: "Martin Müller, research page (undated): states 6×6 Go as a goal"
    url: "https://webdocs.cs.ualberta.ca/~mmueller/research.html"

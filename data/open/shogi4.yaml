notes: >
  Rules as solved (recovered from the official Android package
  com.ocastudios.shogi4 and published on Mistboard). A 4×4 board with five
  pieces a side, each moving one square: a royal (Crane for one player,
  Pheasant for the other) moving as a king, a Carp (one square forward), a
  Fox (one square orthogonally), a Raccoon-dog (one square diagonally) and a
  Tapir (forward or forward-diagonal). Each back row, from the royal's
  corner, is royal, Fox, Raccoon-dog, Tapir, with the Carp one square ahead of
  the royal. A captured piece changes sides and may be dropped on any empty
  square except the opponent's back row; there is no two-pawn, drop-mate or
  dead-piece rule. A piece reaching the far row must promote (Carp, Tapir and
  Raccoon-dog to a silver general's moves, Fox to a gold's), and a captured
  promoted piece reverts. A piece may leap one adjacent ally in a legal move
  direction to the square beyond; no chains, and enemies cannot be jumped.
  Capturing the royal wins; there is no check, moving into capture is
  legal, and there is no king-march win. The app has no repetition rule, so
  the solver declares one: endless play is a draw (threefold repetition in
  played games), with no perpetual-check exception. This is the one rule
  that is the solver's and not Oca's.
  The solved sub-games are reduced games with fewer pieces on the same board
  and rules, not positions of the real game: drops conserve material, so the
  full game never reaches them, and they give no value for Shogi4 from the
  start. This is the maintainer's own work, available only from the shogi4
  repository and the post, so it carries the self-archived mark.

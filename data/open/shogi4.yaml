id: shogi4
name: Shogi4 (4×4, Oca Studios)
genre: shogi
status: open
solved_up_to: "Reduced-material sibling games only: the largest, two kings plus one of each other piece (2,100,849,024 positions), strongly solved; no value for the full game from the start"
next_target: "Full Shogi4 from the start: about 3×10^13 reachable positions over a dense-rank index of 410,297,064,507,360 slots"
barrier:
  - compute
  - storage
barrier_detail: >
  Drops conserve material, so the game graph does not split into smaller
  endgames and has to be solved as one object. The dense-rank index spans
  N = 410,297,064,507,360 slots (about 4.1×10^14, against about 3×10^13
  reachable positions); at two bits a slot the value table is about 100 TB,
  or 50 TB after the left-right fold. From the measured 697 ns per edge out of
  cache on the 2.1-billion-position run, the full solve projects to 130 to 190
  core-years, about $10,000 to $15,000 in cloud terms. A sharded
  external-memory design has been tested against the in-memory solver on
  closed games (1 to 64 shards) but not run at full scale.

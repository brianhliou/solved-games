notes: >
  Breakthrough is a pawn race. Pawns advance straight or diagonally, capturing
  diagonally. Reaching the opponent's back row or capturing all opposing
  pawns wins. Rectangular dimensions here mean width by height.

  The 6×5 proof used parallel proof-number search and patterns that recognize
  a forced breakthrough before play ends. The 2026 work combines endgame
  tablebases, race patterns and parallel proof-number solvers, with a neural
  network scheduling search jobs. Its result establishes a winning strategy
  from the 6×6 start. The opposing results on 6×5 and 6×6 give no general
  winner for larger boards.

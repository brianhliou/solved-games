strength:
  kind: match-result
  claim: "Mistboard reports that KataGo-AnimalChess with Dandelion 4's b10c384 network scored 82 wins, 118 draws and no losses against MistyJungle over 200 games."
  url: "https://mistboard.com/blog/katago-jungle"
url: "https://github.com/hzyhhzy/KataGomo/tree/AnimalChess2025"
last_checked: "2026-10-25"
notes: >-
  The match used 1,000 visits per move on four threads for KataGo and
  five million nodes per move on one thread for MistyJungle, approximately
  two seconds per move for each on the test machine.
  Mistboard's rules code refereed both engines.
  The tested weights are distributed inside
  [Dandelion 4](https://github.com/lxsgx23/Dandelion-Chess/releases/tag/v4.0).
  The branch's
  [LICENSE](https://github.com/hzyhhzy/KataGomo/blob/AnimalChess2025/LICENSE)
  states the engine's MIT terms and dependency exceptions;
  [CONTRIBUTORS](https://github.com/hzyhhzy/KataGomo/blob/AnimalChess2025/CONTRIBUTORS)
  credits the upstream KataGo authors.
  This record covers the AnimalChess branch, not KataGomo's other game branches.
  The match was run and published by Mistboard, which this list's maintainer runs.

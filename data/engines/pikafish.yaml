  supplies credits.
  The separate
  [NNUE agreement](https://www.pikafish.com/list.html)
  requires permission for commercial use.
  This record covers the official xiangqi engine; the existing
  pikafish-jieqi-wasm record covers a different Jieqi branch and build.

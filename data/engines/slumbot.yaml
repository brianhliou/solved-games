notes: >-
  The cited result belongs to the historical limit entrant, not an untrained
  checkout of slumbot2019.
  The available source provides CFR+/MCCFR, strategy evaluation and play tools;
  its betting-tree builder explicitly supports Limit configurations.
  Trained championship strategies are not established as bundled by the README.
  The opponent at slumbot.com is no-limit, so its online results should not be
  attributed to heads-up limit hold'em.

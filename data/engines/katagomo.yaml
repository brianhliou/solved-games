notes: >
  This record covers the Gomoku/Renju engine, rather than every game-specific
  branch in the umbrella repository. The
  [public release](https://github.com/hzyhhzy/KataGomo/releases/tag/Gomoku_20250206)
  includes Freestyle, Standard, Renju and Caro models; Gomocup also offers its
  2026 tournament binary through the
  [download page](https://gomocup.org/download-gomoku-ai/).
  The developer uses the name HZY on the
  [project home page](https://hzyhhzy.github.io/); upstream authors and license
  exceptions are documented in
  [CONTRIBUTORS](https://github.com/hzyhhzy/KataGomo/blob/Gom2024/CONTRIBUTORS)
  and [LICENSE](https://github.com/hzyhhzy/KataGomo/blob/Gom2024/LICENSE).
  Rapfi already covers both catalog ids; together with AlphaGomoku these
  fill the three-engine cap, so Yixin and Embryo are omitted.

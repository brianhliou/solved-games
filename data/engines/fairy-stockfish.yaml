strength:
  kind: competition
  claim: "The project's tournament-results page reports first place in the UEC Cup for Minishogi in 2019, 2021 and 2022."
  url: "https://github.com/fairy-stockfish/Fairy-Stockfish/wiki/Tournament-results"
url: "https://github.com/fairy-stockfish/Fairy-Stockfish"
last_checked: "2026-10-25"
notes: >-
  The competition evidence concerns Minishogi.
  For xiangqi, the
  [strength wiki](https://github.com/fairy-stockfish/Fairy-Stockfish/wiki/Playing-strength)
  reports roughly +100 Elo over Elephant Eye 3.31 and Cyclone 0.55 with
  classical evaluation, cautioning that estimates without uncertainty use
  fewer than 100 games.
  Catalog coverage includes built-in games and examples in
  [variants.ini](https://github.com/fairy-stockfish/Fairy-Stockfish/blob/master/src/variants.ini).
  Small-board Amazons and 6×5 Breakthrough require custom board-size and
  starting-position configurations; disable Black pawn promotion for the
  catalog's Maharajah rules.
  Amazons requires an ALLVARS build with large-board support.
  Nim support uses a bounded board encoding of heaps.
  Credits are in
  [AUTHORS](https://github.com/fairy-stockfish/Fairy-Stockfish/blob/master/AUTHORS).

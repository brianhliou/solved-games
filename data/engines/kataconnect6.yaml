notes: >
  The comparison is dated 2020-07-26 and supplies no match count, hardware or
  time control; no independently verified current ranking was found.
  The [2026 release](https://github.com/hzyhhzy/KataGomo/releases/tag/ConnectSix_20260406)
  supplies engine packages, trained models and opening books.
  Its reported 92% Black win rate on 19×19 is analysis under a move limit,
  not a match result against a named competing engine or a proof of the game.
  The release explicitly acknowledges that an exhaustive solution is missing.
  Upstream credits and license exceptions are documented in

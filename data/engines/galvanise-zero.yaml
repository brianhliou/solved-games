notes: >
  The engine LICENSE credits Richard Emslie. Published networks and game
  rules are in [gzero_data](https://github.com/richemslie/gzero_data);
  its license is separate from the engine's MIT license and contains research
  and commercialization restrictions. Listed games follow the documented
  trained players rather than hypothetical support for arbitrary GDL games.
  The published chess rules use a different draw counter, so that player is
  not mapped to chess-8x8.
  The archived engine requires Python 2.7, TensorFlow and a GPU; installation
  documentation is incomplete. Strength was not established equally for
  every supported game.

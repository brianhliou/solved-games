id: katahex
name: KataHex
kind: engine
games: [hex-7x7, hex-9x9, hex-10x10]
other_games:
  - "Hex on other board sizes, including 11×11, 13×13, 15×15, 19×19 and 27×27"
author: "HZY (hzyhhzy), based on KataGo by David J. Wu and contributors; Peter Selinger maintains a HexGUI-compatible adaptation."
license: "MIT for repository content except separately licensed third-party components."
strength:
  kind: third-party
  claim: "HexWiki describes KataHex as capable of defeating top-level human players."
  url: "https://www.hexwiki.net/index.php/KataHex"
url: "https://github.com/hzyhhzy/KataGomo/tree/Hex2024"
last_checked: "2026-10-25"
notes: >
  HexWiki states that trained networks can play smaller sizes, subject to the
  compiled engine's limits; the cited strength statement is not specific to
  7×7, 9×9 or 10×10. The
  [2025 release](https://github.com/hzyhhzy/KataGomo/releases/tag/Hex_20250131)
  provides an engine/model package and models for boards up to 27×27.
  [Selinger's README](https://github.com/selinger/katahex/tree/Hex2024)
  credits HZY and documents the HexGUI-compatible adaptation.
  License exceptions are listed in the
  [branch LICENSE](https://github.com/hzyhhzy/KataGomo/blob/Hex2024/LICENSE).
  This is neural search, with no perfect-play guarantee.

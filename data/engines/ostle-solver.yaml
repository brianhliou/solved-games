id: ostle-solver
name: ostle_solver
kind: solver
games: [ostle]
author: "Hiroki Takizawa (eukaryo)"
license: "MIT"
strength:
  kind: perfect-play
  claim: "Takizawa (2023) reports a strong solution of Ostle by retrograde analysis, determining a draw from the start and values for all reachable states."
  url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10557503/"
url: "https://github.com/eukaryo/ostle_solver"
last_checked: "2026-10-25"
notes: >-
  Includes query.py for looking up results and continuations, including the
  previous-position restriction.
  Analysis outputs are published at https://doi.org/10.6084/m9.figshare.19668789.v1.
  The README describes about 213 GB of analysis files and requires AVX2/BMI2
  for the native solver.

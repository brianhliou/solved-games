notes: >
  The [official manual](https://www.extremegammon.com/extremegammon2.pdf)
  explicitly credits Xavier Dufaure de Citres for programming.
  The download page offers a Windows binary and states the trial terms.
  The project's file-format documentation names Nackgammon, Hypergammon
  and Longgammon variants.
  The cited comparison uses 500 money games and XG2 rollouts to adjudicate
  disagreements; PR is an error-based performance measure, not Elo.
  The original linked BGonline post could not be retrieved, so the claim
  relies on the project's reproduction of the study.

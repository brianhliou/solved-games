id: aalina
name: Aalina
kind: engine
games: [awari]
author: "Joan Sala Soler"
license: "GPL-3.0-or-later (source notices and COPYING)"
strength:
  kind: match-result
  claim: "The 48Stones benchmark reports Aalina 1.2.0 scoring 23–25 against its database on April 17, 2021, with one suboptimal move in that game."
  url: "https://48stones.com/research-games-benchmark/"
url: "https://github.com/joansalasoler/oware"
last_checked: "2026-10-25"
notes: >-
  Plays Abapa Oware, whose rules differ from the Romein–Bal Awari solution;
  the awari catalog entry also names Oware.
  The benchmark used 3.6 seconds per move and reported a second game lost
  20–28; it is a two-game historical comparison, not a rating.
  The README documents terminal/UCI play, search, an opening book and
  endgame tablebases through 12 seeds.
  Aualé is its graphical interface.

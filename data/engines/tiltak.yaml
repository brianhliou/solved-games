  it does not establish measured 4×4 strength. Actual 4×4 playing support is
  explicit in the
  [TEI dispatcher](https://github.com/MortenLohne/tiltak/blob/master/src/tei.rs),
  which handles sizes 4, 5 and 6. Source builds and command-line play are
  documented in the README. Author and license are stated in
  [Cargo.toml](https://github.com/MortenLohne/tiltak/blob/master/Cargo.toml).
  No complete 4×4 solution is claimed.

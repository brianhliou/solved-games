notes: >
  The author's home page credits Ed Gilbert and links separate English, Italian
  and international downloads. English and Italian engines use CheckerBoard;
  international downloads include a standalone application and a Hub engine.
  English version 1.20 supports the author's downloadable 12-piece endgame
  database. Distance databases support exact endgame conversion or winning
  paths, not perfect play from the full starting position.
  The [English download page](https://edgilbert.org/EnglishCheckers/KingsRowEnglish.htm)
  calls the programs free but does not specify a software license.

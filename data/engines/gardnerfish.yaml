id: gardnerfish
name: Gardnerfish
kind: engine
games: [gardner-minichess]
other_games: ["Baby chess", "Jacobs-Meivoritz chess", "Mallett minichess"]
author: "Mehdi Mhalla and Frédéric Prost, based on Stockfish by its credited authors"
license: "GPL-3.0-or-later (source notices; Copying.txt contains GPL version 3)"
strength:
  kind: self-reported
  claim: "Mhalla and Prost report using their modified Stockfish engine to construct the draw oracles in their solution of Gardner minichess."
  url: "https://arxiv.org/html/1307.7118"
url: "https://github.com/MehdiMhalla/Stockfish"
last_checked: "2026-10-25"
notes: >-
  The authors' Gardnerfish page identifies this repository and describes
  UCI play on the b2–f6 region, with pawn promotion adjusted to that region:
  https://lig-membres.imag.fr/prost/MiniChessResolution/Gardner/index.html.
  Their no-loss argument combines supplied oracles with engine analysis;
  the standalone search engine is not established as an automatic
  perfect-play implementation.
  The page also describes support for other 5×5 chess variants without
  castling or initial double pawn moves.

# Dated progress log: new results, corrections and re-checks, with credit.
# The README's "Recent progress" section shows the newest 10 lines
# (`npm run build`). Every merged change to a result adds a line here; a
# correction credits the person who sent it.
#
# Fields: date (YYYY, YYYY-MM or YYYY-MM-DD), id (a data/games or data/open
# record), what, credit, url, labels (optional: solved, partial, correction,
# unverified, self-archived, preprint, thesis).

- date: "2026-07-14"
  id: tic-tac-chec
  what: "Tic Tac Chec strongly solved under the original 1998 rules: a draw from the empty board over 2,476,597,610 indexed positions; the outbound-only pawn reading is also a draw"
  credit: "Brian Liou"
  url: "https://github.com/brianhliou/tic-tac-chec/releases/tag/tablebase-v1"
  labels: [solved, self-archived]

